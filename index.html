  .member-avatar {

  /* SPINNING ANIMATION */
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  @keyframes fall {

  }
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: fall linear forwards;
    z-index: 9999;
    pointer-events: none;
  }

  /* PULSE */
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .pulse { animation: pulse 2s ease-in-out infinite; }
</style>

  const [spinning, setSpinning] = useState(false);
  const [result, setResult] = useState(null);
  const [angle, setAngle] = useState(0);
  const animRef = useRef(null);
  const currentAngle = useRef(0);

  // Build segments: rewards + "no reward" slots
  const noRewardCount = Math.max(1, Math.floor(rewards.length * 0.4));
  const segments = [...rewards.map(r => ({ label: r.name, color: null, isReward: true })),
    ...Array(noRewardCount).fill({ label: '⭐', color: null, isReward: false })];

  const COLORS = ['#FF7043','#5C6BC0','#FFD54F','#66BB6A','#EC407A','#26C6DA','#FF8A65','#7E57C2'];

  const drawWheel = useCallback((a) => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const cx = canvas.width / 2, cy = canvas.height / 2, r = cx - 4;
    const n = segments.length;
    const arc = (2 * Math.PI) / n;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    segments.forEach((seg, i) => {
      const start = a + i * arc;
      const end = start + arc;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, start, end);
      ctx.closePath();
      ctx.fillStyle = seg.isReward ? COLORS[i % COLORS.length] : '#E0E0E0';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(start + arc / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = seg.isReward ? '#fff' : '#9E9E9E';
      ctx.font = `bold ${n > 6 ? 11 : 13}px Quicksand, sans-serif`;
      const maxLen = 12;
      const label = seg.label.length > maxLen ? seg.label.substring(0, maxLen) + '…' : seg.label;
      ctx.fillText(label, r - 10, 5);
      ctx.restore();
    });

    // Center circle
    ctx.beginPath();
    ctx.arc(cx, cy, 22, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#FF7043';
    ctx.lineWidth = 3;
    ctx.stroke();
  }, [segments]);

  useEffect(() => { drawWheel(currentAngle.current); }, [drawWheel]);

  const spin = () => {
    if (spinning || result) return;
    setSpinning(true);
    const extraSpins = 5 + Math.random() * 5;
    const targetAngle = currentAngle.current + extraSpins * 2 * Math.PI + Math.random() * 2 * Math.PI;
    const duration = 4000;
    const start = performance.now();
    const startAngle = currentAngle.current;

    const animate = (now) => {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 4);
      const current = startAngle + (targetAngle - startAngle) * ease;
      currentAngle.current = current;
      drawWheel(current);

      if (progress < 1) {
        animRef.current = requestAnimationFrame(animate);
      } else {
        setSpinning(false);
        // Find which segment is at top (pointer at top = -PI/2)
        const n = segments.length;
        const arc = (2 * Math.PI) / n;
        const normalized = ((current % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
        const pointer = (2 * Math.PI - normalized + Math.PI * 1.5) % (2 * Math.PI);
        const idx = Math.floor(pointer / arc) % n;
        const hit = segments[idx];
        setResult(hit);
        if (hit.isReward) spawnConfetti();
        onResult && onResult(hit);
      }
    };
    animRef.current = requestAnimationFrame(animate);
  };

  return (
    <div>
      {!result ? (
        <>
          <div className="wheel-container">
            <div className="wheel-pointer" />
            <canvas ref={canvasRef} id="wheelCanvas" width={260} height={260} />
          </div>
          <button className="spin-btn" onClick={spin} disabled={spinning}>
            {spinning ? t.spinning : t.spinWheel}
          </button>
        </>
      ) : (
        <div className="result-wrap">
          <span className="result-emoji">{result.isReward ? '🎁' : '⭐'}</span>
          <div className="result-title">{result.isReward ? t.rewardTitle : t.noRewardTitle}</div>
          <div className="result-msg">
            {result.isReward ? `${result.label}` : t.noRewardMsg}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── CONFETTI ────────────────────────────────────────────────────────────────
function spawnConfetti() {
  const colors = ['#FF7043','#FFD54F','#5C6BC0','#66BB6A','#EC407A'];
  for (let i = 0; i < 60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top = '-20px';
    el.style.background = colors[Math.floor(Math.random() * colors.length)];
    el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    el.style.animationDelay = (Math.random() * 0.5) + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}

// ─── MAIN APP ────────────────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useState('sv');
  const t = T[lang];
  const toggleLang = () => setLang(l => l === 'sv' ? 'en' : 'sv');

  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [family, setFamily] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      if (session) loadProfile(session.user.id);
      else setLoading(false);
    });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, s) => {
      setSession(s);
      if (s) loadProfile(s.user.id);
      else { setProfile(null); setFamily(null); setLoading(false); }
    });
    return () => subscription.unsubscribe();
  }, []);

  const loadProfile = async (uid) => {
    const { data } = await sb.from('profiles').select('*').eq('id', uid).single();
    setProfile(data);
    if (data?.family_id) {
      const { data: fam } = await sb.from('families').select('*').eq('id', data.family_id).single();
      setFamily(fam);
    }
    setLoading(false);
  };

  const logout = async () => { await sb.auth.signOut(); };

  if (loading) return (
    <div className="auth-wrap">
      <div className="auth-logo">Fam<span>eye</span></div>
      <p style={{color:'var(--text-soft)', fontWeight:600}}>{t.loading}</p>
    </div>
  );

  return (
    <div className="app">
      {session && (
        <div className="topbar">
          <div className="topbar-logo">Fam<span>eye</span></div>
          <div className="topbar-right">
            <button className="lang-btn" onClick={toggleLang}>{t.lang}</button>
            <button className="logout-btn" onClick={logout}>{t.logout}</button>
          </div>
        </div>
      )}

      {!session && <AuthScreen t={t} toggleLang={toggleLang} lang={lang} />}
      {session && !profile && <div className="content"><p>{t.loading}</p></div>}
      {session && profile && !profile.family_id && <SetupScreen t={t} profile={profile} onDone={() => loadProfile(session.user.id)} />}
      {session && profile && profile.family_id && family && (
        profile.role === 'parent'
          ? <ParentApp t={t} profile={profile} family={family} />
          : <ChildApp t={t} profile={profile} family={family} />
      )}
    </div>
  );
}

// ─── AUTH ────────────────────────────────────────────────────────────────────
function AuthScreen({ t, toggleLang, lang }) {
  const [tab, setTab] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  const [role, setRole] = useState('parent');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const handleLogin = async () => {
    setLoading(true); setError('');
    const { error: e } = await sb.auth.signInWithPassword({ email, password });
    if (e) setError(e.message);
    setLoading(false);
  };

  const handleSignup = async () => {
    setLoading(true); setError('');
    const { data, error: e } = await sb.auth.signUp({ email, password });
    if (e) { setError(e.message); setLoading(false); return; }
    if (data.user) {
      await sb.from('profiles').insert({ id: data.user.id, name, role, email });
    }
    setLoading(false);
  };

  return (
    <div className="auth-wrap">
      <div style={{position:'absolute',top:20,right:20}}>
        <button className="lang-btn" onClick={toggleLang}>{lang === 'sv' ? 'EN' : 'SV'}</button>
      </div>
      <div className="auth-logo">Fam<span>eye</span></div>
      <div className="auth-tagline">{t.appTagline}</div>
      <div className="auth-card">
        <div className="auth-tabs">
          <button className={`auth-tab ${tab==='login'?'active':''}`} onClick={()=>setTab('login')}>{t.login}</button>
          <button className={`auth-tab ${tab==='signup'?'active':''}`} onClick={()=>setTab('signup')}>{t.signup}</button>
        </div>
        {error && <div className="error-msg">{error}</div>}
        {tab === 'signup' && (
          <>
            <div className="input-group">
              <label>{t.name}</label>
              <input value={name} onChange={e=>setName(e.target.value)} placeholder="Anna" />
            </div>
            <div className="input-group">
              <label>{t.role}</label>
              <div className="role-wrap">
                <div className={`role-card ${role==='parent'?'selected':''}`} onClick={()=>setRole('parent')}>
                  <div className="role-emoji">👨‍👩‍👧</div>
                  <div className="role-title">{t.parent}</div>
                  <div className="role-desc">{t.parentDesc}</div>
                </div>
                <div className={`role-card ${role==='child'?'selected':''}`} onClick={()=>setRole('child')}>
                  <div className="role-emoji">⭐</div>
                  <div className="role-title">{t.child}</div>
                  <div className="role-desc">{t.childDesc}</div>
                </div>
              </div>
            </div>
          </>
        )}
        <div className="input-group">
          <label>{t.email}</label>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="namn@exempel.se" />
        </div>
        <div className="input-group">
          <label>{t.password}</label>
          <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" />
        </div>
        <button className="btn btn-primary" onClick={tab==='login'?handleLogin:handleSignup} disabled={loading}>
          {loading ? t.loading : tab==='login' ? t.login : t.signup}
        </button>
      </div>
    </div>
  );
}

// ─── SETUP ───────────────────────────────────────────────────────────────────
function SetupScreen({ t, profile, onDone }) {
  const [code, setCode] = useState('');
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);

  const createFamily = async () => {
    setLoading(true); setError('');
    const inviteCode = Math.random().toString(36).substring(2, 8).toUpperCase();
    const { data: fam, error: e } = await sb.from('families').insert({ name: `${profile.name}'s Family`, invite_code: inviteCode, created_by: profile.id }).select().single();
    if (e) { setError(e.message); setLoading(false); return; }
    await sb.from('profiles').update({ family_id: fam.id }).eq('id', profile.id);
    onDone();
  };

  const joinFamily = async () => {
    setLoading(true); setError('');
    const { data: fam, error: e } = await sb.from('families').select('*').eq('invite_code', code.toUpperCase()).single();
    if (e || !fam) { setError('Ogiltig kod / Invalid code'); setLoading(false); return; }
    await sb.from('profiles').update({ family_id: fam.id }).eq('id', profile.id);
    onDone();
  };

  return (
    <div className="auth-wrap" style={{paddingTop: 60}}>
      <div style={{fontSize:48, marginBottom:12}}>👋</div>
      <div style={{fontFamily:'Nunito',fontWeight:900,fontSize:24,marginBottom:8}}>
        {t.greeting}, {profile.name}!
      </div>
      <div style={{color:'var(--text-soft)',fontWeight:600,marginBottom:32,fontSize:15}}>
        {profile.role === 'parent' ? t.createFamily : t.joinFamily}
      </div>
      <div className="auth-card">
        {error && <div className="error-msg">{error}</div>}
        {profile.role === 'parent' ? (
          <button className="btn btn-primary" onClick={createFamily} disabled={loading}>
            {loading ? t.loading : `✨ ${t.createFamily}`}
          </button>
        ) : (
          <>
            <div className="input-group">
              <label>{t.enterCode}</label>
              <input value={code} onChange={e=>setCode(e.target.value)} placeholder="ABC123" style={{textTransform:'uppercase',letterSpacing:4,textAlign:'center',fontSize:22}} />
            </div>
            <button className="btn btn-primary" onClick={joinFamily} disabled={loading}>
              {loading ? t.loading : `🏠 ${t.joinFamily}`}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ─── PARENT APP ──────────────────────────────────────────────────────────────
function ParentApp({ t, profile, family }) {
  const [tab, setTab] = useState('tasks');
  const [tasks, setTasks] = useState([]);
  const [rewards, setRewards] = useState([]);
  const [completions, setCompletions] = useState([]);
  const [members, setMembers] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = async () => {
    const [{ data: ts }, { data: rs }, { data: cs }, { data: ms }] = await Promise.all([
      sb.from('tasks').select('*').eq('family_id', family.id).order('created_at', {ascending:false}),
      sb.from('rewards').select('*').eq('family_id', family.id),
      sb.from('completions').select('*, profiles(name)').eq('family_id', family.id).eq('approved', false),
      sb.from('profiles').select('*').eq('family_id', family.id),
    ]);
    setTasks(ts || []);
    setRewards(rs || []);
    setCompletions(cs || []);
    setMembers(ms || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const pendingCount = completions.length;

  return (
    <>
      <div className="content">
        <div className="hero-wrap">
          <div className="hero-greeting">{t.greeting} 👋</div>
          <div className="hero-name">{profile.name}</div>
          <div className="hero-subtitle">{family.name}</div>
        </div>

        {tab === 'tasks' && <ParentTasks t={t} family={family} tasks={tasks} rewards={rewards} completions={completions} reload={load} />}
        {tab === 'rewards' && <ParentRewards t={t} family={family} rewards={rewards} reload={load} />}
        {tab === 'family' && <FamilyTab t={t} family={family} members={members} />}
      </div>
      <div className="tab-nav">
        <button className={`tab-btn ${tab==='tasks'?'active':''}`} onClick={()=>setTab('tasks')}>
          <span className="tab-icon">📋</span>
          <span className="tab-label">{t.tasks}{pendingCount>0 && <span className="badge">{pendingCount}</span>}</span>
        </button>
        <button className={`tab-btn ${tab==='rewards'?'active':''}`} onClick={()=>setTab('rewards')}>
          <span className="tab-icon">🎁</span>
          <span className="tab-label">{t.rewards}</span>
        </button>
        <button className={`tab-btn ${tab==='family'?'active':''}`} onClick={()=>setTab('family')}>
          <span className="tab-icon">👨‍👩‍👧</span>
          <span className="tab-label">{t.family}</span>
        </button>
      </div>
    </>
  );
}

function ParentTasks({ t, family, tasks, rewards, completions, reload }) {
  const [showAdd, setShowAdd] = useState(false);
  const [name, setName] = useState('');
  const [desc, setDesc] = useState('');
  const [emoji, setEmoji] = useState('🧹');
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');
  const [approveItem, setApproveItem] = useState(null);
  const [msgText, setMsgText] = useState('');
  const [wheelResult, setWheelResult] = useState(null);
  const [showWheel, setShowWheel] = useState(false);

  const EMOJIS = ['🧹','🍽️','🛒','🐕','📚','🧺','🚿','🌱','🪟','🛏️','♻️','🍳'];

  const addTask = async () => {
    if (!name.trim()) return;
    const { error: e } = await sb.from('tasks').insert({ family_id: family.id, name, description: desc, emoji });
    if (e) { setError(t.error); return; }
    setName(''); setDesc(''); setEmoji('🧹'); setShowAdd(false);
    setSuccess(t.taskAdded);
    setTimeout(()=>setSuccess(''), 3000);
    reload();
  };

  const deleteTask = async (id) => {
    await sb.from('tasks').delete().eq('id', id);
    reload();
  };

  const startApprove = (comp) => {
    setApproveItem(comp);
    setMsgText('');
    setWheelResult(null);
    setShowWheel(false);
  };

  const finishApprove = async (giveReward) => {
    if (!approveItem) return;
    await sb.from('completions').update({
      approved: true,
      parent_message: msgText,
      reward_given: giveReward ? (wheelResult?.label || null) : null,
    }).eq('id', approveItem.id);
    setApproveItem(null);
    reload();
  };

  return (
    <>
      {success && <div className="success-msg">{success}</div>}
      {error && <div className="error-msg">{error}</div>}

      {/* PENDING APPROVALS */}
      {completions.length > 0 && (
        <>
          <div className="section-head">
            <div className="section-title">⏳ {t.pendingApprovals}</div>
          </div>
          {completions.map(c => (
            <div className="card approve-card" key={c.id}>
              <div className="task-card">
                <div className="task-emoji" style={{fontSize:28}}>{c.task_emoji || '✅'}</div>
                <div className="task-info">
                  <div className="task-name">{c.task_name}</div>
                  <div className="task-desc">{c.profiles?.name} {t.youCompleted}</div>
                </div>
              </div>
              <button className="btn btn-primary" style={{marginTop:12}} onClick={()=>startApprove(c)}>
                {t.approve} →
              </button>
            </div>
          ))}
          <div className="divider" />
        </>
      )}

      {/* TASKS LIST */}
      <div className="section-head">
        <div className="section-title">{t.tasks}</div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(s=>!s)}>+ {t.addTask}</button>
      </div>

      {showAdd && (
        <div className="card" style={{marginBottom:16}}>
          <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:12}}>
            {EMOJIS.map(e => (
              <button key={e} onClick={()=>setEmoji(e)} style={{
                fontSize:24, background: emoji===e ? 'var(--primary-light)' : 'var(--bg)',
                border: emoji===e ? '2px solid var(--primary)' : '2px solid transparent',
                borderRadius:10, padding:'6px 8px', cursor:'pointer'
              }}>{e}</button>
            ))}
          </div>
          <div className="input-group">
            <label>{t.taskName}</label>
            <input value={name} onChange={e=>setName(e.target.value)} placeholder={lang==='sv'?'Diska...':'Do the dishes...'} />
          </div>
          <div className="input-group">
            <label>{t.taskDesc}</label>
            <input value={desc} onChange={e=>setDesc(e.target.value)} placeholder="..." />
          </div>
          <button className="btn btn-primary" onClick={addTask}>💾 {t.save}</button>
        </div>
      )}

      {tasks.length === 0 && !showAdd && (
        <div className="empty-state">
          <div className="empty-emoji">📋</div>
          <p>{t.noTasks}</p>
          <p style={{fontSize:13,marginTop:4}}>{t.noTasksDesc}</p>
        </div>
      )}

      {tasks.map(task => (
        <div className="card task-card" key={task.id}>
          <div className="task-emoji">{task.emoji}</div>
          <div className="task-info">
            <div className="task-name">{task.name}</div>
            {task.description && <div className="task-desc">{task.description}</div>}
          </div>
          <button className="btn btn-danger btn-sm" onClick={()=>deleteTask(task.id)}>✕</button>
        </div>
      ))}

      {/* APPROVE MODAL */}
      {approveItem && (
        <div className="wheel-overlay" onClick={e=>{if(e.target.className==='wheel-overlay')setApproveItem(null)}}>
          <div className="wheel-modal">
            <div className="wheel-title">🎯 {approveItem.task_name}</div>
            <div className="wheel-sub">{approveItem.profiles?.name} {t.youCompleted}</div>

            {!showWheel ? (
              <>
                <textarea
                  className="msg-input"
                  rows={3}
                  placeholder={t.messagePlaceholder}
                  value={msgText}
                  onChange={e=>setMsgText(e.target.value)}
                />
                <div style={{display:'flex',gap:10,marginTop:16}}>
                  {rewards.length > 0 && (
                    <button className="btn btn-primary" onClick={()=>setShowWheel(true)}>
                      🎡 {t.spinWheel}
                    </button>
                  )}
                  <button className="btn btn-ghost" onClick={()=>finishApprove(false)}>
                    ✓ {t.approve}
                  </button>
                </div>
              </>
            ) : (
              <>
                <SpinWheel rewards={rewards} onResult={r=>setWheelResult(r)} t={t} />
                {wheelResult && (
                  <>
                    {msgText && <div className="parent-msg-bubble">💬 "{msgText}"</div>}
                    <button className="btn btn-primary" onClick={()=>finishApprove(wheelResult.isReward)}>
                      ✓ {t.spinAgain}
                    </button>
                  </>
                )}
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

          <div className="empty-emoji">🎁</div>
          <p>{lang==='sv'?'Inga belöningar ännu':'No rewards yet'}</p>
          <p style={{fontSize:13,marginTop:4}}>{lang==='sv'?'Lägg till vad barnen kan vinna':'Add what your kids can win'}</p>
        </div>
      )}

      {rewards.length > 0 && (
        <div className="card" style={{marginTop:16,background:'var(--secondary-light)',border:'none'}}>
          <div style={{fontFamily:'Nunito',fontWeight:800,fontSize:15,color:'var(--secondary)',marginBottom:6}}>🎡 {lang==='sv'?'Förhandsgranskning av hjulet':'Wheel preview'}</div>
          <SpinWheel rewards={rewards} t={t} />
        </div>
      )}
    </>
  );
}

function FamilyTab({ t, family, members }) {
  const [copied, setCopied] = useState(false);

  const copyCode = () => {
    navigator.clipboard.writeText(family.invite_code);
    setCopied(true);
    setTimeout(()=>setCopied(false), 2000);
  };

  return (
    <>
      <div className="section-head">
        <div className="section-title">{t.myFamily}</div>
      </div>
      <div className="card">
        <div className="code-label">{t.familyCode_label}</div>
        <div className="code-display">
          <div className="code-label">{t.inviteCode}</div>
          <div className="code-value">{family.invite_code}</div>
        </div>
        <button className="btn btn-secondary" onClick={copyCode}>
          {copied ? `✓ ${t.copied}` : `📋 ${t.copy}`}
        </button>
      </div>

      <div className="divider" />
      <div className="section-title" style={{marginBottom:12}}>{lang==='sv'?'Medlemmar':'Members'}</div>
      <div className="card">
        {members.map(m => (
          <div className="member-item" key={m.id}>
            <div className="member-avatar">{m.role==='parent'?'👨‍👩‍👧':'⭐'}</div>
            <div>
              <div className="member-name">{m.name}</div>
              <div className="member-role">{m.role === 'parent' ? t.parent : t.child}</div>
            </div>
          </div>
        ))}
      </div>
    </>
  );
}

// ─── CHILD APP ───────────────────────────────────────────────────────────────
function ChildApp({ t, profile, family }) {
  const [tasks, setTasks] = useState([]);
  const [completions, setCompletions] = useState([]);
  const [rewards, setRewards] = useState([]);
  const [activeCompletion, setActiveCompletion] = useState(null);
  const [showWheel, setShowWheel] = useState(false);
  const [wheelResult, setWheelResult] = useState(null);
  const [loading, setLoading] = useState(true);

  const load = async () => {
    const [{ data: ts }, { data: cs }, { data: rs }] = await Promise.all([
      sb.from('tasks').select('*').eq('family_id', family.id),
      sb.from('completions').select('*').eq('child_id', profile.id).order('created_at', {ascending:false}),
      sb.from('rewards').select('*').eq('family_id', family.id),
    ]);
    setTasks(ts || []);
    setCompletions(cs || []);
    setRewards(rs || []);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  const markDone = async (task) => {
    const { data: comp, error } = await sb.from('completions').insert({
      family_id: family.id,
      child_id: profile.id,
      task_id: task.id,
      task_name: task.name,
      task_emoji: task.emoji,
      approved: false,
    }).select().single();
    if (!error && comp) {
      setShowWheel(true);
      setWheelResult(null);
      setActiveCompletion(comp);
      load();
    }
  };

  const getTaskStatus = (taskId) => {
    const c = completions.find(c => c.task_id === taskId);
    if (!c) return null;
    if (c.approved) return 'approved';
    return 'done';
  };

  const approvedWithReward = completions.filter(c => c.approved && c.reward_given);
  const approvedWithMsg = completions.filter(c => c.approved && c.parent_message);

  return (
    <>
      <div className="content">
        <div className="hero-wrap pulse">
          <div className="hero-greeting">{t.greeting} ⭐</div>
          <div className="hero-name">{profile.name}</div>
          <div className="hero-subtitle">{family.name}</div>
        </div>

        <div className="section-head">
          <div className="section-title">{t.tasks}</div>
        </div>

        {tasks.length === 0 && (
          <div className="empty-state">
            <div className="empty-emoji">🌟</div>
            <p>{t.noTasksChild}</p>
            <p style={{fontSize:13,marginTop:4}}>{t.noTasksChildDesc}</p>
          </div>
        )}

        {tasks.map(task => {
          const status = getTaskStatus(task.id);
          return (
            <div className="card task-card" key={task.id}>
              <div className="task-emoji">{task.emoji}</div>
              <div className="task-info">
                <div className="task-name">{task.name}</div>
                {task.description && <div className="task-desc">{task.description}</div>}
              </div>
              {!status && (
                <button className="complete-btn" onClick={()=>markDone(task)}>
                  {t.markDone}
                </button>
              )}
              {status === 'done' && <span className="task-status status-done">{t.done}</span>}
              {status === 'approved' && <span className="task-status status-approved">{t.approved}</span>}
            </div>
          );
        })}

        {/* MESSAGES FROM PARENT */}
        {approvedWithMsg.length > 0 && (
          <>
            <div className="divider" />
            <div className="section-title" style={{marginBottom:12}}>💬 {lang==='sv'?'Från mamma/pappa':'From your parent'}</div>
            {approvedWithMsg.slice(0, 5).map(c => (
              <div className="card" key={c.id} style={{borderLeft:'4px solid var(--secondary)'}}>
                <div style={{fontSize:13,fontWeight:700,color:'var(--text-soft)',marginBottom:6}}>{c.task_emoji} {c.task_name}</div>
                <div className="parent-msg-bubble" style={{margin:0}}>"{c.parent_message}"</div>
                {c.reward_given && (
                  <div style={{marginTop:8,fontWeight:700,color:'var(--primary)'}}>🎁 {c.reward_given}</div>
                )}
              </div>
            ))}
          </>
        )}
      </div>

      {/* WHEEL MODAL */}
      {showWheel && (
        <div className="wheel-overlay">
          <div className="wheel-modal">
            <div className="wheel-title">✅ {t.done}</div>
            <div className="wheel-sub">{activeCompletion?.task_name}</div>
            {rewards.length > 0 ? (
              <>
                <SpinWheel rewards={rewards} onResult={r=>setWheelResult(r)} t={t} />
                {wheelResult && (
                  <button className="btn btn-primary" style={{marginTop:16}} onClick={()=>setShowWheel(false)}>
                    👍 {t.spinAgain}
                  </button>
                )}
              </>
            ) : (
              <>
                <div style={{fontSize:48,margin:'20px 0'}}>⭐</div>
                <div style={{fontFamily:'Nunito',fontWeight:800,fontSize:18,marginBottom:8}}>{t.noRewardTitle}</div>
                <div style={{color:'var(--text-soft)',fontWeight:600,fontSize:14,marginBottom:20}}>{t.noRewardMsg}</div>
                <button className="btn btn-primary" onClick={()=>setShowWheel(false)}>👍</button>
              </>
            )}
          </div>
        </div>
      )}
    </>
  );
}

// Fix lang reference in inner components
let lang = 'sv';
const origApp = App;

ReactDOM.render(<App />, document.getElementById('root'));
</script>
